[workspace]
resolver = "3"
members = [
  "crates/fs-core",
  "crates/fs-tools",
  "crates/fs-config",
  "crates/fs-storage",
  "crates/fs-checklists",
  "crates/fs-recon",
  "crates/fs-wordlists",
  "crates/fs-reporting",
  "crates/fs-ai",
  "crates/fs-oob",
  "crates/fs-ad",
  "crates/fs-adapters",
  "crates/fs-wifi",
  "crates/fs-redteam",
  "crates/fs-mobile",
  "crates/fs-cli",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["FableScope Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "time", "fs", "io-util", "net", "sync"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
